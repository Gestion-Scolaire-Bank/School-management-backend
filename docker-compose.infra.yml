# Infrastructure partagee (Postgres, Redis, Kafka, MinIO, MongoDB, Prometheus, Grafana).
# Demarrage independant de l'infra, cf. section 9.1 :
#   docker compose -f docker-compose.infra.yml up -d
name: schoolmanage-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: sm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolmanage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolmanage_dev_pwd}
    ports:
      # Port hote 5434 (et non 5432) : deux PostgreSQL locaux (v14 et v16) occupent deja 5432
      # et 5433 sur cette machine de dev. Cote conteneur (communication inter-services), le port
      # reste 5432 - aucun impact sur les URLs jdbc:postgresql://postgres:5432/... du reseau Docker.
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolmanage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [schoolmanage-net]

  # Read-replica PostgreSQL (lecture seule) - cf. section 8.2 "Ports infrastructure" (port 5433)
  # A activer en TEST/PROD via streaming replication ; en DEV, laisse commente par defaut.
  # postgres-replica:
  #   image: postgres:16-alpine
  #   container_name: sm-postgres-replica
  #   ports:
  #     - "5433:5432"
  #   networks: [schoolmanage-net]

  redis:
    image: redis:7-alpine
    container_name: sm-redis
    restart: unless-stopped
    # Pas de mot de passe par defaut : REDIS_PASSWORD doit etre defini dans .env (obligatoire,
    # cf. revue de securite - Redis stocke la blacklist JWT et les cles d'idempotence paiement).
    # Port hote retire volontairement : seuls les conteneurs du reseau schoolmanage-net y accedent ;
    # pour une inspection manuelle, utiliser `docker exec -it sm-redis redis-cli -a $REDIS_PASSWORD`.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [schoolmanage-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sm-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [schoolmanage-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sm-kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [schoolmanage-net]

  minio:
    image: minio/minio:latest
    container_name: sm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schoolmanage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schoolmanage_dev_pwd}
    ports:
      - "9005:9000" # API S3 (documents, recus, bulletins, cartes ID - cf. 8.2)
      - "9001:9001" # Console web MinIO
    volumes:
      - minio_data:/data
    networks: [schoolmanage-net]

  mongo:
    image: mongo:7
    container_name: sm-mongo
    restart: unless-stopped
    # Faille corrigee : ce service tournait sans authentification et exposait son port sur la
    # machine hote (n'importe qui joignant le serveur pouvait lire/ecrire les groupes/messages
    # WhatsApp sans identifiant). Meme traitement que Redis ci-dessus : mot de passe obligatoire
    # + port hote retire (seuls les conteneurs du reseau schoolmanage-net y accedent). Les
    # variables MONGO_INITDB_ROOT_* n'initialisent l'utilisateur qu'au tout premier demarrage
    # (volume vide) - sur un volume existant, l'utilisateur doit etre cree une fois a la main
    # (cf. infra/backup/README.md) avant que `--auth` ne soit applique.
    command: mongod --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-schoolmanage}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-schoolmanage_dev_pwd}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_ROOT_USER:-schoolmanage}", "-p", "${MONGO_ROOT_PASSWORD:-schoolmanage_dev_pwd}", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [schoolmanage-net]
    # Utilise par whatsapp-service pour l'archivage/moderation des messages (cf. 5.2 - S11)

  # Oracle (rapports d'entreprise, archives financieres pluriannuelles, vues materialisees - cf. 8.3)
  # Image Oracle sous licence proprietaire : a fournir par l'equipe (ex: gvenzl/oracle-free) une
  # fois les acces obtenus. Laisse commente pour ne pas bloquer le demarrage en DEV.
  # oracle:
  #   image: gvenzl/oracle-free:23-slim
  #   container_name: sm-oracle
  #   restart: unless-stopped
  #   environment:
  #     ORACLE_PASSWORD: schoolmanage_dev_pwd
  #   ports:
  #     - "1521:1521"
  #   networks: [schoolmanage-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: sm-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [schoolmanage-net]

  grafana:
    image: grafana/grafana:latest
    container_name: sm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      # Port hote 3001 (et non 3000) : un autre processus local occupe deja le 3000 sur cette
      # machine de dev.
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    networks: [schoolmanage-net]

networks:
  schoolmanage-net:
    external: true
    name: schoolmanage-net

volumes:
  pg_data:
  redis_data:
  minio_data:
  mongo_data:
  grafana_data:
