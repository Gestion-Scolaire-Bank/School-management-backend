# Configuration PARTAGEE par tous les clients de sm-config-service (convention Spring Cloud
# Config : le fichier "application.yml", sans prefixe, s'applique a tous les services quel que
# soit leur nom). Chaque service peut surcharger ces valeurs dans son propre {service-name}.yml.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${SM_REGISTRY_URL:http://sm-registry-service:8761/eureka}
  instance:
    prefer-ip-address: true

# Roles RBAC communs a la plateforme (section 6.3 / 11.2)
schoolmanage:
  security:
    roles: [PARENT, ENSEIGNANT, ADMINISTRATEUR, DIRECTEUR]
    jwt:
      access-ttl-minutes: 15
      refresh-ttl-days: 7
