# Configuration centralisee - registration-service
# Distribuee par sm-config-service (Spring Cloud Config Server, section 5.1)
server:
  port: 8082

kafka:
  bootstrap-servers: ${KAFKA_BROKER:kafka:9092}

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}

database:
  name: sm_registration_db
  host: ${POSTGRES_HOST:sm-postgres}
  port: ${POSTGRES_PORT:5432}

schoolmanage:
  services:
    auth:
      base-url: ${SM_AUTH_SERVICE_URL:http://auth-service:8081}
    admin:
      base-url: ${SM_ADMIN_SERVICE_URL:http://admin-service:8092}
  storage:
    bucket: sm-registration-dev
  kafka:
    topic:
      student-enrolled: sm.registration.student.enrolled
