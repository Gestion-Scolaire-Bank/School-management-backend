# Configuration centralisee - auth-service
# Distribuee par sm-config-service (Spring Cloud Config Server, section 5.1)
server:
  port: 8081

kafka:
  bootstrap-servers: ${KAFKA_BROKER:kafka:9092}

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}

database:
  name: sm_auth_db
  host: ${POSTGRES_HOST:sm-postgres}
  port: ${POSTGRES_PORT:5432}

schoolmanage:
  security:
    jwt:
      secret: ${SM_AUTH_JWT_SECRET:change-me-in-prod-please}
      access-ttl-minutes: ${SM_AUTH_ACCESS_TTL_MIN:15}
      refresh-ttl-days: ${SM_AUTH_REFRESH_TTL_DAYS:7}
  kafka:
    topic:
      user-registered: sm.auth.user.registered
      user-created: sm.auth.user.created
      password-reset-requested: sm.auth.password.reset.requested
  frontend:
    base-url: ${SM_FRONTEND_BASE_URL:http://localhost:5173}
