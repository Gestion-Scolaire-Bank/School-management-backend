# Configuration centralisee - admin-service
# Distribuee par sm-config-service (Spring Cloud Config Server, section 5.1)
server:
  port: 8092

kafka:
  bootstrap-servers: ${KAFKA_BROKER:kafka:9092}

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}

database:
  name: sm_admin_db
  host: ${POSTGRES_HOST:sm-postgres}
  port: ${POSTGRES_PORT:5432}

schoolmanage:
  services:
    auth:
      base-url: ${SM_AUTH_SERVICE_URL:http://auth-service:8081}
  kafka:
    topic:
      class-created: sm.admin.class.created
      teacher-assignment-created: sm.admin.teacher_assignment.created
      fee-schedule-created: sm.admin.fee_schedule.created
