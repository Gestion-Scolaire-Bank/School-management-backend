# Secrets (identifiants DB, cles JWT, cles Mobile Money) - section 9.2 "ConfigMap / Secret".
# NE JAMAIS committer le fichier reel "secrets.yaml" (deja exclu par .gitignore).
# Utiliser "kubectl create secret" ou un outil de gestion de secrets (Vault, Sealed Secrets,
# SOPS) en production plutot que ce fichier statique.
apiVersion: v1
kind: Secret
metadata:
  name: schoolmanage-secrets
  namespace: schoolmanage-prod
type: Opaque
stringData:
  POSTGRES_USER: "schoolmanage"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SM_AUTH_JWT_SECRET: "CHANGE_ME"
  SM_PAYMENT_MTN_API_KEY: "CHANGE_ME"
  SM_PAYMENT_ORANGE_API_KEY: "CHANGE_ME"
  SM_NOTIFICATION_SENDGRID_API_KEY: "CHANGE_ME"
  SM_NOTIFICATION_TWILIO_SID: "CHANGE_ME"
  SM_NOTIFICATION_TWILIO_TOKEN: "CHANGE_ME"
  SM_NOTIFICATION_FCM_SERVER_KEY: "CHANGE_ME"
  SM_WHATSAPP_CLOUD_API_TOKEN: "CHANGE_ME"
  SM_WHATSAPP_PHONE_NUMBER_ID: "CHANGE_ME"
