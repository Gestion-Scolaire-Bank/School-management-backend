apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-gateway-service
  namespace: schoolmanage-prod
  labels: { app: sm-gateway-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sm-gateway-service }
  template:
    metadata:
      labels: { app: sm-gateway-service }
    spec:
      # Ordre de demarrage obligatoire (section 5.1) : attend que sm-registry-service reponde.
      initContainers:
        - name: wait-for-registry-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until wget -qO- http://sm-registry-service:8761/actuator/health; do echo waiting for sm-registry-service; sleep 3; done"
      containers:
        - name: sm-gateway-service
          image: ghcr.io/OWNER/schoolmanage-sm-gateway-service:latest
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef: { name: schoolmanage-shared-config }
            - secretRef: { name: schoolmanage-secrets }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sm-gateway-service
  namespace: schoolmanage-prod
spec:
  type: ClusterIP
  selector: { app: sm-gateway-service }
  ports:
    - port: 8888
      targetPort: 8888
