apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-registry-service
  namespace: schoolmanage-prod
  labels: { app: sm-registry-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sm-registry-service }
  template:
    metadata:
      labels: { app: sm-registry-service }
    spec:
      # Ordre de demarrage obligatoire (section 5.1) : attend que sm-config-service reponde.
      initContainers:
        - name: wait-for-config-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until wget -qO- http://sm-config-service:8080/actuator/health; do echo waiting for sm-config-service; sleep 3; done"
      containers:
        - name: sm-registry-service
          image: ghcr.io/OWNER/schoolmanage-sm-registry-service:latest
          ports:
            - containerPort: 8761
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sm-registry-service
  namespace: schoolmanage-prod
spec:
  type: ClusterIP
  selector: { app: sm-registry-service }
  ports:
    - port: 8761
      targetPort: 8761
