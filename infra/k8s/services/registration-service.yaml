apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: schoolmanage-prod
  labels: { app: registration-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: registration-service }
  template:
    metadata:
      labels: { app: registration-service }
    spec:
      containers:
        - name: registration-service
          image: ghcr.io/OWNER/schoolmanage-registration-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: schoolmanage-shared-config }
            - secretRef: { name: schoolmanage-secrets }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: schoolmanage-prod
spec:
  type: ClusterIP
  selector: { app: registration-service }
  ports:
    - port: 8082
      targetPort: 8082
