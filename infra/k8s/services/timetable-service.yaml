apiVersion: apps/v1
kind: Deployment
metadata:
  name: timetable-service
  namespace: schoolmanage-prod
  labels: { app: timetable-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: timetable-service }
  template:
    metadata:
      labels: { app: timetable-service }
    spec:
      containers:
        - name: timetable-service
          image: ghcr.io/OWNER/schoolmanage-timetable-service:latest
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef: { name: schoolmanage-shared-config }
            - secretRef: { name: schoolmanage-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8093 }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8093 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: timetable-service
  namespace: schoolmanage-prod
spec:
  type: ClusterIP
  selector: { app: timetable-service }
  ports:
    - port: 8093
      targetPort: 8093
