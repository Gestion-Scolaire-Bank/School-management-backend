server:
  port: 8082

spring:
  application:
    name: registration-service
  config:
    import: optional:configserver:${SM_CONFIG_SERVER_URL:http://localhost:8080}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/sm_registration_db
    username: ${POSTGRES_USER:schoolmanage}
    password: ${POSTGRES_PASSWORD:schoolmanage_dev_pwd}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

schoolmanage:
  services:
    auth:
      base-url: ${SM_AUTH_SERVICE_URL:http://auth-service:8081}
    admin:
      base-url: ${SM_ADMIN_SERVICE_URL:http://admin-service:8092}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:schoolmanage}
    secret-key: ${MINIO_SECRET_KEY:schoolmanage_dev_pwd}
    bucket: sm-registration-dev
  kafka:
    topic:
      student-enrolled: sm.registration.student.enrolled

eureka:
  client:
    service-url:
      defaultZone: ${SM_REGISTRY_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
