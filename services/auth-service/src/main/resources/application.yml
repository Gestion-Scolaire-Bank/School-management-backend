server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${SM_CONFIG_SERVER_URL:http://localhost:8080}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/sm_auth_db
    username: ${POSTGRES_USER:schoolmanage}
    password: ${POSTGRES_PASSWORD:schoolmanage_dev_pwd}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

schoolmanage:
  security:
    jwt:
      secret: ${SM_AUTH_JWT_SECRET:change-me-in-prod-please}
      access-ttl-minutes: ${SM_AUTH_ACCESS_TTL_MIN:15}
      refresh-ttl-days: ${SM_AUTH_REFRESH_TTL_DAYS:7}
  kafka:
    topic:
      account-created: sm.auth.account.created
      user-created: sm.auth.user.created
      password-reset-requested: sm.auth.password.reset.requested
  frontend:
    base-url: ${SM_FRONTEND_BASE_URL:http://localhost:5173}

eureka:
  client:
    service-url:
      defaultZone: ${SM_REGISTRY_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
