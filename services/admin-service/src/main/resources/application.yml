server:
  port: 8092

spring:
  application:
    name: admin-service
  config:
    import: optional:configserver:${SM_CONFIG_SERVER_URL:http://localhost:8080}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/sm_admin_db
    username: ${POSTGRES_USER:schoolmanage}
    password: ${POSTGRES_PASSWORD:schoolmanage_dev_pwd}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    producer:
      properties:
        # Echoue rapidement si Kafka est injoignable au lieu de bloquer la requete HTTP
        # jusqu'a 60s (valeur par defaut du client) - cf. incident constate en verifiant
        # l'implementation : une premiere publication vers un nouveau topic bloquait le
        # thread de la requete le temps de la resolution des metadonnees.
        max.block.ms: 3000

schoolmanage:
  services:
    auth:
      base-url: ${SM_AUTH_SERVICE_URL:http://auth-service:8081}
  kafka:
    topic:
      class-created: sm.admin.class.created
      teacher-assignment-created: sm.admin.teacher_assignment.created
      fee-schedule-created: sm.admin.fee_schedule.created
      establishment-created: sm.admin.establishment.created

eureka:
  client:
    service-url:
      defaultZone: ${SM_REGISTRY_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
