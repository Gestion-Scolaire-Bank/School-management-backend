# Pipeline CI/CD SchoolManage App - declenche a chaque push sur main (section 9.4).
# Etapes : Build -> Test -> Scan (Trivy) -> Push (GHCR) -> Deploy staging -> Smoke test -> Prod (approbation manuelle)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/schoolmanage

jobs:
  # ------------------------------------------------------------------
  # Detecte quels micro-services ont ete modifies pour ne construire
  # que ce qui a change (monorepo).
  # ------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sm-config-service: ['services/sm-config-service/**']
            sm-registry-service: ['services/sm-registry-service/**']
            sm-gateway-service: ['services/sm-gateway-service/**']
            auth-service: ['services/auth-service/**']
            registration-service: ['services/registration-service/**']
            payment-service: ['services/payment-service/**']
            admin-service: ['services/admin-service/**']
            presence-service: ['services/presence-service/**']
            notification-service: ['services/notification-service/**']
            userstatus-service: ['services/userstatus-service/**']
            whatsapp-service: ['services/whatsapp-service/**']
            reportcard-service: ['services/reportcard-service/**']
            pedagogic-service: ['services/pedagogic-service/**']
            schoolid-service: ['services/schoolid-service/**']
            analytics-service: ['services/analytics-service/**']

  # ------------------------------------------------------------------
  # 1 - Build & 2 - Test (par service modifie)
  # ------------------------------------------------------------------
  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Detecter la stack technique du service
        id: stack
        run: |
          cd services/${{ matrix.service }}
          if [ -f pom.xml ]; then echo "type=java" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f requirements.txt ]; then echo "type=python" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.stack.outputs.type == 'java'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }

      - name: Build + Test (Maven)
        if: steps.stack.outputs.type == 'java'
        run: mvn -B -f services/${{ matrix.service }}/pom.xml verify

      - name: Setup Node 20
        if: steps.stack.outputs.type == 'node'
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: services/${{ matrix.service }}/package-lock.json }

      - name: Install + Test (npm/Jest)
        if: steps.stack.outputs.type == 'node'
        working-directory: services/${{ matrix.service }}
        run: |
          npm install
          npm test --if-present

      - name: Setup Python 3.11
        if: steps.stack.outputs.type == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install + Test (pip/PyTest)
        if: steps.stack.outputs.type == 'python'
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pytest || true

      # --------------------------------------------------------------
      # 3 - Scan de vulnerabilites (Trivy) sur l'image Docker candidate
      # --------------------------------------------------------------
      - name: Build image Docker locale
        run: docker build -t schoolmanage/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Scan Trivy (CVE critiques)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: schoolmanage/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      # --------------------------------------------------------------
      # 4 - Push vers GitHub Container Registry
      # --------------------------------------------------------------
      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}
          docker tag schoolmanage/${{ matrix.service }}:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag schoolmanage/${{ matrix.service }}:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # ------------------------------------------------------------------
  # 5 - Deploy staging (kubectl apply, namespace de test)
  # ------------------------------------------------------------------
  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configurer kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
      - name: Deployer sur le namespace de test
        run: kubectl --kubeconfig kubeconfig.yaml apply -f infra/k8s -n schoolmanage-test

      # --------------------------------------------------------------
      # 6 - Smoke test (disponibilite des endpoints critiques)
      # --------------------------------------------------------------
      - name: Smoke test - endpoints de sante
        run: |
          curl -sf https://staging.schoolmanage.example.cm/actuator/health || exit 1

  # ------------------------------------------------------------------
  # 7 - Prod (deploiement final, validation manuelle via l'environment
  # GitHub "production" configure avec des reviewers requis)
  # ------------------------------------------------------------------
  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configurer kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig.yaml
      - name: Deployer en production (Rolling Update)
        run: kubectl --kubeconfig kubeconfig.yaml apply -f infra/k8s -n schoolmanage-prod
